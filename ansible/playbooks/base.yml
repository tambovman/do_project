---
- name: Configure common packages on all lab hosts
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - vim
          - unzip
          - ca-certificates
        state: present
